---
name: Feature Request
description: Provide a description of a feature which needs to be added
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe 
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting your suggested improvement
      options:
        - label: I have tied this to an exsiting milestone
          required: false
        - label: I'm not able to find an open issue
          required: false
  - type: textarea
    attributes:
      label: Problem
      description: Please describe the problem you are aiming to solve with this suggested improvement. If applicable, add a screenshot, gif, or video to better convey your idea.
      placeholder: |
        Short description
    validations:
      required: false
  - type: textarea
    attributes:
      label: Solution
      description: Please describe what you might want to happen to address this issue. If applicable, add a screenshot, gif, or video to better convey your idea.
      placeholder: |
        Short description
    validations:
      required: false