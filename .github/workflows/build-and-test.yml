name: DeepMimic Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 2 * * 0'  # Weekly build on Sunday at 2 AM

env:
  TF_USE_LEGACY_KERAS: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.9, '3.10', 3.11]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache system packages
      uses: actions/cache@v3
      with:
        path: |
          /var/cache/apt
          /var/lib/apt
        key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/build-and-test.yml') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          patchelf swig libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
          libopenmpi-dev mesa-utils clang cmake bison byacc build-essential \
          wget curl tar autoconf libtool pkg-config libssl-dev zlib1g-dev \
          libglew-dev freeglut3-dev libglu1-mesa-dev libffi-dev \
          xvfb valgrind # For headless testing and memory checks
    
    - name: Cache compiled libraries
      uses: actions/cache@v3
      with:
        path: |
          libs/
          py/
        key: deepmimic-libs-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('setup.sh') }}
        restore-keys: |
          deepmimic-libs-${{ runner.os }}-py${{ matrix.python-version }}-
          deepmimic-libs-${{ runner.os }}-
    
    - name: Run setup script
      run: |
        chmod +x setup.sh
        ./setup.sh
    
    - name: Verify Python environment
      run: |
        source setup_env.sh
        python --version
        pip list
        echo "Python executable: $(which python)"
        echo "TF_USE_LEGACY_KERAS: $TF_USE_LEGACY_KERAS"
    
    - name: Test DeepMimicCore import
      run: |
        source setup_env.sh
        python3 -c "import DeepMimicCore; print('✓ DeepMimicCore imported successfully')"
    
    - name: Test basic functionality (headless)
      run: |
        source setup_env.sh
        # Test that the system can at least initialize without graphics
        xvfb-run -a python3 -c "
        import sys
        sys.path.append('.')
        try:
            from learning.rl_world import RLWorld
            print('✓ Core modules can be imported')
        except Exception as e:
            print(f'⚠️ Warning: {e}')
            print('This may be expected in CI environment without full graphics support')
        "
    
    - name: Verify MPI functionality
      run: |
        source setup_env.sh
        mpiexec -n 2 python3 -c "
        from mpi4py import MPI
        comm = MPI.COMM_WORLD
        rank = comm.Get_rank()
        size = comm.Get_size()
        print(f'✓ MPI rank {rank} of {size} processes')
        "

  build-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t deepmimic:test -f docker/Dockerfile .
    
    - name: Test Docker container
      run: |
        docker run --rm deepmimic:test python3 -c "import DeepMimicCore; print('✓ Docker build successful')"

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Check Python code formatting
      run: |
        black --check --diff learning/ util/ *.py || true
        isort --check-only --diff learning/ util/ *.py || true
    
    - name: Run flake8 linting
      run: |
        flake8 learning/ util/ *.py --max-line-length=100 --ignore=E203,W503 || true
    
    - name: Check shell script syntax
      run: |
        shellcheck setup.sh setup_env.sh || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security scan
      uses: github/super-linter@v4
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_PYTHON_FLAKE8: false
        VALIDATE_BASH: true
        VALIDATE_DOCKERFILE: true
